# KommasKorrektus - development stack: builds the image from the source in this folder.
#   ./scripts/redeploy.ps1            (rebuilds the container and redeploys the stack)
#   docker compose -f docker-compose.dev.yml up -d --build
#
# Web:      http://localhost:2930
# pgAdmin:  http://localhost:2931   (admin@kommaskorrektus.example.com / kommaskorrektus)
# Postgres: localhost:12930         (for tests and tools)
name: kommaskorrektus-dev

services:
  kommaskorrektus:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        Channel: ${KOMMASKORREKTUS_CHANNEL:-local}
        BuildNumber: ${KOMMASKORREKTUS_BUILD_NUMBER:-0}
        BuildDate: ${KOMMASKORREKTUS_BUILD_DATE:-}
    image: kommaskorrektus:dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "2930:2930"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - kommaskorrektus-data:/data

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: kommaskorrektus
      POSTGRES_DB: kommaskorrektus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kommaskorrektus"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      # Only for local tests and tools.
      - "12930:5432"
    volumes:
      - kommaskorrektus-db:/var/lib/postgresql/data

  # Database UI of the development stack. Add the server "db" (user postgres, password kommaskorrektus).
  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@kommaskorrektus.example.com
      PGADMIN_DEFAULT_PASSWORD: kommaskorrektus
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "2931:80"
    depends_on:
      - db
    volumes:
      - kommaskorrektus-pgadmin:/var/lib/pgadmin

# An explicit subnet: on a PC with many stacks Docker runs out of its default address pools ("all predefined address pools
# have been fully subnetted"). Override with KOMMASKORREKTUS_DEV_SUBNET if this range collides with something.
networks:
  default:
    ipam:
      config:
        - subnet: ${KOMMASKORREKTUS_DEV_SUBNET:-10.253.30.0/24}

volumes:
  kommaskorrektus-data:
  kommaskorrektus-db:
  kommaskorrektus-pgadmin:
