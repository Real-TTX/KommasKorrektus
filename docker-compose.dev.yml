# KommaKorrektus - development stack: builds the image from the source in this folder.
#   ./scripts/redeploy.ps1            (rebuilds the container and redeploys the stack)
#   docker compose -f docker-compose.dev.yml up -d --build
#
# Web:      http://localhost:2930
# pgAdmin:  http://localhost:2931   (admin@kommakorrektus.local / kommakorrektus)
# Postgres: localhost:12930         (for tests and tools)
name: kommakorrektus-dev

services:
  kommakorrektus:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        Channel: ${KOMMAKORREKTUS_CHANNEL:-local}
        BuildNumber: ${KOMMAKORREKTUS_BUILD_NUMBER:-0}
        BuildDate: ${KOMMAKORREKTUS_BUILD_DATE:-}
    image: kommakorrektus:dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "2930:2930"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - kommakorrektus-data:/data

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: kommakorrektus
      POSTGRES_DB: kommakorrektus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kommakorrektus"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      # Only for local tests and tools.
      - "12930:5432"
    volumes:
      - kommakorrektus-db:/var/lib/postgresql/data

  # Database UI of the development stack. Add the server "db" (user postgres, password kommakorrektus).
  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@kommakorrektus.local
      PGADMIN_DEFAULT_PASSWORD: kommakorrektus
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "2931:80"
    depends_on:
      - db
    volumes:
      - kommakorrektus-pgadmin:/var/lib/pgadmin

# An explicit subnet: on a PC with many stacks Docker runs out of its default address pools ("all predefined address pools
# have been fully subnetted"). Override with KOMMAKORREKTUS_DEV_SUBNET if this range collides with something.
networks:
  default:
    ipam:
      config:
        - subnet: ${KOMMAKORREKTUS_DEV_SUBNET:-10.253.30.0/24}

volumes:
  kommakorrektus-data:
  kommakorrektus-db:
  kommakorrektus-pgadmin:
