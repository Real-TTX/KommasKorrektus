services:
  kommaskorrektus:
    image: ghcr.io/real-ttx/kommaskorrektus:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "2930:2930"   # web interface (HTTP: put a reverse proxy with TLS in front)
    volumes:
      - kommaskorrektus-data:/data

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: kommaskorrektus
    volumes:
      - kommaskorrektus-db:/var/lib/postgresql/data

volumes:
  kommaskorrektus-data:
  kommaskorrektus-db:
